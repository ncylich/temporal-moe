          <text x="168.5" y="20.3" text-anchor="middle" font-size="5.5" fill="#5b6b7d">+ t_RAM</text>
          <line x1="10" y1="33" x2="192" y2="33" stroke="#0B5394" stroke-width="1.2" marker-end="url(#ahT)"></line>
          <line x1="10" y1="30.5" x2="10" y2="35.5" stroke="#0B5394" stroke-width="1"></line>
